name: Test and Deploy Rice Disease API

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  HF_SPACE: Munzali/RICE_DISEASES_CLASSIFICATION

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyTorch CPU
        run: |
          python -m pip install --upgrade pip

          pip install \
            torch==2.0.1 \
            torchvision==0.15.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Verify model
        run: |
          test -f models/efficientnet_b0_best.pth
          echo "✅ Model found"

      - name: Run tests
        run: |
          pytest tests/ -v


  # ============================================================
  # 2. BUILD DOCKER IMAGE
  # ============================================================
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rice-disease-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build successful
        run: |
          echo "✅ Docker image built successfully"


  # ============================================================
  # 3. DEPLOY TO HUGGING FACE
  # ============================================================
  deploy:
    name: Deploy to Hugging Face
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Hugging Face CLI
        run: |
          python -m pip install --upgrade pip
          pip install -U huggingface_hub

      - name: Deploy production files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload "$HF_SPACE" . . \
            --repo-type space \
            --token "$HF_TOKEN" \
            --include "Dockerfile" \
            --include "README.md" \
            --include "app.py" \
            --include "gradio_app.py" \
            --include "inference.py" \
            --include "requirements.txt" \
            --include "models/efficientnet_b0_best.pth" \
            --delete="*" \
            --commit-message="Deploy production API - $GITHUB_SHA"

      - name: Deployment complete
        run: |
          echo "🚀 Deployment completed successfully"
          echo "Space: https://huggingface.co/spaces/$HF_SPACE"
