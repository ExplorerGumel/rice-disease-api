name: Build and Deploy Docker Image to HF Space

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  
env:
  REGISTRY: registry.hf.space
  HF_NAMESPACE: Munzali
  HF_SPACE_NAME: rice_diseases_classification
  IMAGE_NAME: registry.hf.space/Munzali/rice-diseases-classification
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run tests
        run: pytest tests/ -v || echo "No tests found"

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Hugging Face Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was pushed
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "📦 Image: ${{ env.IMAGE_NAME }}:latest"
          echo "🔖 Also tagged as: ${{ env.IMAGE_NAME }}:${{ github.sha }}"

  restart-space:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Restart Hugging Face Space
        run: |
          curl -X POST "https://huggingface.co/api/spaces/${{ env.HF_NAMESPACE }}/${{ env.HF_SPACE_NAME }}/restart" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}"
      
      - name: Wait for Space to be ready
        run: |
          echo "⏳ Waiting for Space to restart..."
          sleep 60
          
          # Check if Space is running
          echo "✅ Check your Space at: https://huggingface.co/spaces/${{ env.HF_NAMESPACE }}/${{ env.HF_SPACE_NAME }}"
