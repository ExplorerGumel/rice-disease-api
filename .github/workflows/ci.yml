name: Build and Deploy to HF Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run tests
        run: pytest tests/ -v || echo "No tests found"

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Hugging Face Registry
        uses: docker/login-action@v3
        with:
          registry: registry.hf.space
          username: munzali
          password: ${{ secrets.HF_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.hf.space/munzali/rice-diseases-classification:latest
            registry.hf.space/munzali/rice-diseases-classification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was pushed
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "📦 Image: registry.hf.space/munzali/rice-diseases-classification:latest"

  restart-space:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Restart Hugging Face Space
        run: |
          # API uses original name (with uppercase)
          curl -X POST "https://huggingface.co/api/spaces/Munzali/RICE_DISEASES_CLASSIFICATION/restart" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}"
