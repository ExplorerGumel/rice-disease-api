name: Rice Disease Classification CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v || echo "No tests found"

  deploy-to-space:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Hugging Face Hub
        run: pip install -U "huggingface_hub[cli]"

      - name: Upload only required files to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload Munzali/RICE_DISEASES_CLASSIFICATION \
            app.py \
            model.py \
            requirements.txt \
            README.md \
            efficientnet_b0_best.pth \
            --repo-type=space \
            --token=$HF_TOKEN \
            --commit-message="Deploy from GitHub Actions"
